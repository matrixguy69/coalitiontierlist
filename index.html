<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minecraft PvP Tierlist</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #e5e7eb;
}
header {
  padding: 24px;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
}
.kit {
  max-width: 1100px;
  margin: 40px auto;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
}
.kit h2 {
  text-align: center;
  margin-bottom: 20px;
}
.tiers {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.tier {
  border-radius: 10px;
  padding: 12px;
  min-height: 140px;
}
.tier h3 {
  text-align: center;
  margin-bottom: 8px;
}
.S { background: #064e3b; border: 2px solid #22c55e; }
.A { background: #1e3a8a; border: 2px solid #60a5fa; }
.B { background: #3f3f46; border: 2px solid #a1a1aa; }
.C { background: #422006; border: 2px solid #facc15; }
.D { background: #450a0a; border: 2px solid #f87171; }

.player {
  background: #020617;
  margin: 6px 0;
  padding: 6px;
  border-radius: 6px;
  text-align: center;
  font-size: 14px;
}

.points {
  font-size: 12px;
  opacity: 0.8;
  text-align: center;
}
footer {
  text-align: center;
  padding: 30px;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>Minecraft PvP Tierlist</header>

<script>
const kits = ["SWORD","POT","MACE","SMP","DIASMP","NETHPOT"];
const tiers = [
  {name:"S", pts:30},
  {name:"A", pts:20},
  {name:"B", pts:15},
  {name:"C", pts:10},
  {name:"D", pts:5},
];

document.write(
  kits.map(kit => `
    <div class="kit">
      <h2>${kit}</h2>
      <div class="tiers">
        ${tiers.map(t => `
          <div class="tier ${t.name}">
            <h3>${t.name} Tier</h3>
            <div class="points">${t.pts} pts</div>
            <div class="player">Player1</div>
            <div class="player">Player2</div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("")
);
</script>

<footer>
Tier System: S(30) • A(20) • B(15) • C(10) • D(5)
</footer>

</body>
</html>
